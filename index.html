function gzMove(e,cs){const d=GZ.drag,rc=mkRay(e,cs),r=lray(rc,d.inv),u=d.u,sn=d.snap,f3=x=>+x.toFixed(3);
if(u.k=='m'){const s=axS(r,d.cL,d.a);if(s==null)return;const dl=s-d.s0;if(SEL.k=='part'){const pt=S.parts[SEL.i];pt.x=f3(sn.x+d.a.x*dl);pt.y=f3(sn.y+d.a.y*dl);pt.z=f3(sn.z+d.a.z*dl);applyPart(SEL.i)}else{S.rp.x=f3(sn.rp.x+d.a.x*dl);S.rp.y=f3(sn.rp.y+d.a.y*dl);S.rp.z=f3(sn.rp.z+d.a.z*dl);applyReel()}}

/* ===== フリーズ ===== */
function beginSpin(){G.ph='spin';G.R.forEach(R=>{R.st='spin';R.v=0});hud();trStart();if(S.auto)autoStop()}
function pickFz(f){const k=!f?'miss':f.t=='big'?'big':f.t=='reg'?'reg':(S.syms[f.i].rare?'rare':'win');for(const z of S.fz)if(z.on&&(z.ev==k||z.ev=='any')&&Math.random()<1/Math.max(1,z.odds))return z;return null}
function startFz(z){const f=G.flag;{const u=fzSnd(z,'start');if(u)sndUrl(u)}G.frzWin=f&&f.t=='sym'?S.strips.map(()=>S.syms[f.i].id??f.i):(f&&(f.t=='big'||f.t=='reg')?(f.t=='big'?(S.bigs[f.k]||S.bigs[0]).pick:S.reg.pick):null);G.R.forEach(R=>{R.ap=0});G.frz={d:z,t0:performance.now()};G.ph='frz';G.R.forEach(R=>{R.pb=R.p;R.st='frz'});const pt=S.fp.find(q=>q.id==z.fid);if(pt&&pt.f.length&&pt.f.reduce((a,x)=>a+x.ms,0)>0){const fr=[];let t=0;while(t<z.ms&&fr.length<4000)pt.f.forEach(x=>{fr.push(x);t+=x.ms});G.fx={fr,t0:performance.now()}}hud()}

function sndUrl(u){try{const a=new Audio(u);a.play().catch(()=>{})}catch(e){}}
function frzTick(dt,nw){const z=G.frz;if(!z)return;const t=nw-z.t0,K=S.koma;if(z.lastCue==null)z.lastCue=-1;G.rpmFrz=0;
const pend=G.R.some(R=>R.ap||R.bnc);
if(t>=z.d.ms&&!pend){const u=fzSnd(z.d,'end');if(u)sndUrl(u);G.frz=null;G.fx=null;G.R.forEach(R=>{R.p=((R.pb!=null?R.pb:R.p)%K+K)%K;R.pb=null;R.bl=false;R.ap=0;R.st='idle'});beginSpin();return}
let tt=t,f=z.d.rf[z.d.rf.length-1],fi=z.d.rf.length-1;for(let q=0;q<z.d.rf.length;q++){const x=z.d.rf[q];if(tt<x.ms){f=x;fi=q;break}tt-=x.ms}

if(act=='spin')v=sp;else if(act=='slow')v=(f.rpm||10)/60*K;else if(act=='rev')v=-(f.rpm||40)/60*K;
else if(act=='align'){R.ap=1;const tg=frzTarget(z.d,r),cur=((R.pb%K)+K)%K,d=((tg-cur)%K+K)%K;if(d<=sp*dt+1e-9){R.pb=tg;R.ap=0;act='hold';v=0;if(S.style=='bounce')R.bnc={tg:tg,t:0}}else{v=sp}}
if(v){const q=Math.abs(v)*60/K;if(q>(G.rpmFrz||0))G.rpmFrz=q}R.pb=((R.pb+v*dt)%K+K)%K;R.p=R.pb+(act=='shake'?Math.sin(nw/18+r)*.06:0);R.bl=act=='spin'||act=='rev'||(act=='align'&&v>0);R.st='frz'})}
function frzTarget(z,r){const pt=G.frzWin||null;const w=pt!=null?pt[r]:null;if(w==null||w<0)return Math.round(G.R[r]?G.R[r].pb||0:0);const K=S.koma,rv=S.strips[r].slice().reverse();for(let i=0;i<K;i++)if(rv[i]==w)return i;return 0}
function fzUI(){const ACT=[['hold','停止のまま'],['spin','回転'],['slow','ゆっくり回転'],['rev','逆回転'],['shake','小刻みに震える'],['align','成立図柄に揃える(演出)']],EV=[['big','BIGフラグ成立'],['reg','REGフラグ成立'],['rare','レア役成立'],['win','小役成立'],['miss','ハズレ'],['any','毎ゲーム']];
